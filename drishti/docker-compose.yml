version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: drishti-db
    environment:
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: drishti
      POSTGRES_DB: drishti
    ports:
      - "5432:5432"
    volumes:
      - drishti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: drishti-backend
    environment:
      DATABASE_URL: postgresql://drishti:drishti@db:5432/drishti
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: drishti-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  drishti_pgdata:
